<div class="container footer-container">
  <p>
    {{ site.name | escape }} -
    <a href="mailto:{{ site.email }}" target="_blank">{{ site.email | escape }}</a>
    {%- if site.footer_show_references -%}
      &nbsp;- {{ site.references_title | default: "References on request" }}
    {%- endif -%}
  </p>
</div>
<canvas id="psychedelic-background" aria-hidden="true"></canvas>
<script src="{{ '/assets/js/psychedelic-background.js' | relative_url }}" defer></script>
